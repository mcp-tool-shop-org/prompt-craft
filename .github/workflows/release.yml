# Publishing prompt-craft — PyPI and npm, from a tag, by OIDC.
#
# WHY THERE IS NO PUSH TRIGGER. Publishing is irreversible: a version number, once taken
# on either registry, is taken forever. A push trigger would make every commit a candidate
# for that. The release event is a deliberate human act, which is the kind of thing that
# should be able to reach a registry.
#
# `workflow_dispatch` is the second door, and it is deliberate too — a release whose
# publish step failed has to be re-runnable without cutting a new tag. But it IS a door,
# and this header used to say this workflow ran on `release: published` and nothing else
# while `workflow_dispatch:` sat six lines below it. That sentence was not merely stale:
# the version check below had been skipping itself on exactly the trigger the header
# denied existed. Both are fixed; a dispatch is now held to the same version check as a
# release. See the step named "The version in the tag must equal the version in the package".
#
# WHY THERE ARE NO TOKENS HERE. Both jobs authenticate by OIDC (Trusted Publishing), so no
# long-lived credential exists to leak from this repository or any developer's machine.
# `id-token: write` mints the short-lived one, per job, at publish time.
#
# THE NAMES, AND WHY THEY DIFFER FROM THE REPO. `pcraft` and `prompt-craft` were both
# taken on PyPI, so the DISTRIBUTION is `prompt-crafter` while the import package and the
# console script stay `pcraft` — `pip install prompt-crafter` gives you `import pcraft`
# and a `pcraft` command. npm matches the distribution rather than the repo so the two
# install lines rhyme.
#
# ONE-TIME SETUP, on the registries themselves — until both are done this workflow fails
# at the publish step by design rather than falling back to a token:
#   PyPI  → pending publisher for project `prompt-crafter`:
#           owner mcp-tool-shop-org · repo prompt-craft · workflow release.yml
#           · environment release                                              [DONE]
#   npm   → trusted publisher for `@mcptoolshop/prompt-crafter`: same FOUR values.
#           npm accepts a publisher for a name with zero published versions, so the first
#           OIDC run CREATES the package. An E404 on that first publish means the trusted
#           publisher is not configured yet — npm masks a missing publisher as 404, never
#           as an auth error. Configure it, then `gh run rerun <id> --failed`.
#
# THE ENVIRONMENT IS THE FOURTH VALUE, AND IT IS NOT OPTIONAL. Both publish jobs below
# declare `environment: release`, but a trusted publisher registered WITHOUT an environment
# accepts a token from any run of this workflow — so the job asserts a boundary the
# registry does not require, and the assertion can be removed by editing this file. PyPI
# flags this after the first publish from an environment; the fix is registry-side, in the
# project's publishing settings. Go there directly rather than through the emailed link:
# a one-click "constrain your publisher" link is exactly the shape a credential phish takes,
# and the notification is most convincing right after a genuine release.
#
# CONSTRAINING THE PUBLISHER WAS HALF THE JOB; BOTH HALVES ARE NOW DONE. The publisher is
# pinned to `release` on PyPI, and the environment itself — which on 2026-08-18 had ZERO
# protection rules and no branch policy, measured rather than assumed — now carries:
#
#   required reviewer          mcp-tool-shop
#   deployment branch policy   tag `v*` only (custom policies on, protected_branches off)
#
# Both halves are needed and neither is sufficient. Pinning the publisher narrows WHICH
# workflow can publish; the environment rules narrow WHO can cause it to run and FROM WHAT
# REF. An environment with no rules is a label, not a gate, so pinning to it alone would
# have read stronger than it was.
#
# WHAT THIS CHANGES AT RELEASE TIME: the `pypi` and `npm` jobs now PAUSE for approval
# before they publish, and a `workflow_dispatch` from a branch can no longer reach the
# environment at all — the ref must be a `v*` tag. That pause is the last human gate in
# front of an irreversible action, which is where a pause belongs.
#
# To verify:  gh api repos/mcp-tool-shop-org/prompt-craft/environments/release
# To undo:    gh api -X PUT .../environments/release with reviewers: [] and
#             deployment_branch_policy: null
#
# The publisher's project name and workflow FILENAME are both matched byte-for-byte at
# authentication time. That is why this file is `release.yml` and not `publish.yml`.
#
# ---------------------------------------------------------------------------------------
# HOW TO PROVE THIS WORKFLOW WITHOUT PUBLISHING ANYTHING. Run these BEFORE cutting the tag
# you intend to release; the whole point is that they cost nothing to fail.
#
# Everything above this block was verified by careful static reading -- the Node24 action
# majors, the version check that used to skip itself on `workflow_dispatch`, the `release`
# environment's reviewer and `tag v*` policy. None of it had been exercised by a real run
# reaching the approval gate. What DID exist was the opposite: the run triggered by the
# v1.0.0 release sat in `waiting` for 302 hours, armed against that tag, holding a dist
# artifact built from a workflow revision no longer on main -- until it was cancelled by
# hand. v1.0.0 was tagged and never published; both registries were measured at 0.4.0 at that
# point. A workflow nobody exercises is exactly the one that discovers something during a
# release, and this is the recipe for exercising it on purpose instead.
#
#   0. BEFORE TAGGING, look for a run left armed. A pending deployment is invisible unless
#      you go looking, and that is how one went unnoticed for 302 hours:
#        gh run list --workflow=release.yml --limit 10
#        # any run in `waiting` is holding an approval against some tag -- resolve it
#        # (approve or reject) before cutting a new one, or you are stacking a second
#        # armed run on top of a stale one.
#
#   1. RUNG ONE -- gates only, no approval, no deployment, nothing left armed:
#        gh workflow run release.yml --ref v1.0.1 -f dry_run=true
#      Green means: checkout/setup/install ran on the Node24 majors, `verify.py --installed`
#      passed on THAT tag's tree, twine checked the metadata, and the tag/pyproject/npm
#      version comparison agreed. The `pypi` and `npm` jobs are skipped, so the `release`
#      environment is never entered: no deployment is created and no reviewer is asked.
#      `dry_run` defaults to TRUE, so a dispatch someone fires without reading this is the
#      harmless one; publishing from a dispatch requires deliberately unchecking the box.
#
#   2. RUNG TWO -- prove the environment gate itself, still publishing nothing:
#        gh workflow run release.yml --ref v1.0.1 -f dry_run=false
#      This arms the environment on purpose. Both publish jobs pause for the required
#      reviewer BEFORE either registry is touched, so the safe move is to REJECT both
#      pending deployments at the prompt. Rejected-not-published is the proof that the
#      reviewer rule is real; if the jobs run straight through without pausing, the
#      environment's protection rules are gone and the pin above is a label again.
#
#   3. RUNG THREE, optional -- dispatch from a BRANCH ref. What this actually proves is the
#      version-check step's ref-type refusal, which is the message an operator would really
#      see: `verify` fails, so `pypi` and `npm` never start and the environment is never
#      reached. Note what that means: the `tag v*` deployment branch policy sits BEHIND a
#      refusal that fires first and cannot be exercised without removing the step in front of
#      it. Two guards deep is the intended shape, and the outer one is the one under test.
#
# WHAT A DRY RUN DOES NOT PROVE, because a gate reporting more scope than it has is this
# repo's subject: it never enters the `release` environment, so it says nothing about the
# reviewer rule, the branch policy, or OIDC minting -- that is rung two's job, and rung two
# still cannot prove a publish SUCCEEDS without doing one. It also still uploads the `dist`
# artifact (deliberately: that exercises upload-artifact@v7). The artifact expires on its
# own and is never downloaded; it is not a pending approval and holds nothing open.
# ---------------------------------------------------------------------------------------

name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Prove the gate without publishing: run verify, build, twine check and the
          tag/version comparison, then STOP. The pypi and npm jobs are skipped, so the
          release environment is never entered and no approval is armed.
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The gate. Neither registry is reached until the suite passes on the tagged tree and
  # the built artifacts have been checked — a broken publish cannot be taken back.
  verify:
    runs-on: ubuntu-latest
    steps:
      # Node24-native action majors; the reason is written out in ci.yml's step block.
      # It matters most here: this is the workflow that reaches PyPI and npm, it runs
      # only on a tag, and it had not run recently enough to even log the deprecation
      # warning the other two files were printing. A workflow nobody exercises is
      # exactly the one that discovers a removed runtime during a release.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        # The documented install path, same as ci.yml. If this fails, the README's
        # `pip install -e ".[dev]"` is a claim the tree cannot support, and that is worth
        # failing a release over.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Verify
        # Suite, suite again under -O, and a build — one command, the same one a developer
        # runs. The -O pass is not ceremony: `assert` is stripped under -O, so a refusal
        # written as an assertion silently disappears. Every gate here raises, and this
        # proves it still does on the tagged tree.
        run: python verify.py --installed

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: The version in the tag must equal the version in the package
        # A tag that disagrees with the metadata publishes a version nobody asked for.
        #
        # WHY THIS NOW RUNS ON BOTH TRIGGER PATHS. The tag comparison used to sit inside
        # `if [ "${{ github.event_name }}" = "release" ]`. That conditional arrived with the
        # file in 4b6fdfc, inherited unmodified from the template this workflow was adapted
        # from, and carried no reason anywhere — in a repo that names every deliberate
        # exception. What it did was skip the one check that speaks to this repo's actual
        # failure whenever the run came in by `workflow_dispatch`. The unconditional
        # pyproject==npm comparison kept running and kept passing, because two files that
        # are equally wrong about the tag still agree with each other.
        #
        # The `release` environment's `tag v*` policy is not this check. It narrows WHICH
        # ref may publish; it says nothing about whether that ref's NAME matches the version
        # inside the tree. A dispatch against an existing tag cut before a version bump
        # satisfies the policy and disagrees with pyproject — the state verify.py's own
        # docstring says this environment "has lied about the version twice" about. So the
        # guard is the ref TYPE, not the event name: any run standing on a tag is compared,
        # however it was started.
        #
        # A run standing on a BRANCH cannot make this assertion at all, so it fails rather
        # than passing quietly. Nothing is lost: the environment already forbids publishing
        # from a branch, so such a run could never have finished its job. Reporting it green
        # would be "could not check" printed as "checked clean" — the rule --skip-editable
        # and the bare `VERIFY OK` are both held to, and the whole subject of this package.
        #
        # No `workflow_dispatch` input carries the tag: that would be a second source of
        # truth for a fact the ref already states, free to disagree with it. The ref is
        # authoritative. GITHUB_REF_TYPE / GITHUB_REF_NAME / GITHUB_EVENT_NAME are read as
        # environment variables rather than `${{ }}` expressions so that nothing is
        # interpolated into the script before the shell sees it.
        run: |
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NPM=$(node -p "require('./npm/package.json').version")
          echo "trigger=$GITHUB_EVENT_NAME ref_type=$GITHUB_REF_TYPE ref_name=$GITHUB_REF_NAME pyproject=$PKG npm=$NPM"
          [ "$PKG" = "$NPM" ] || { echo "::error::pyproject $PKG != npm $NPM -- the two manifests in this tree declare different versions, so publishing would put a number on one registry that the other does not claim. This is the cheap one: bump the lagging file to match the other, commit, and cut a fresh tag from that commit. Do not publish from this ref."; exit 1; }
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::release.yml is standing on $GITHUB_REF_TYPE '$GITHUB_REF_NAME', not a tag, so the tag-vs-package version check could not run. This workflow publishes only from a v* tag; re-dispatch it against one. Refusing rather than reporting an unchecked version as checked."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != pyproject $PKG -- the tag names a version this tree does not declare, which is the tag-cut-before-the-version-bump case the comment above describes. There is no cheap fix and the obvious one is wrong: do not force-push or move this tag, because a GitHub Release may already point at it and moving it silently changes what that release refers to. Either cut a new release from a commit where pyproject.toml and npm/package.json already read $TAG, or delete this release and its tag and re-tag from such a commit."; exit 1; }

      # upload@v7 here and download@v8 in the `pypi` job are a matched pair and must be
      # bumped together -- the artifact this uploads is the one that gets published, so a
      # mismatch is a bad publish, not a red step. Both defaults were read back rather than
      # assumed: upload's `archive` still defaults true and download's `skip-decompress`
      # still defaults false, so `dist/` arrives extracted exactly as it did under v4.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      # A skipped job is quiet: GitHub greys the `pypi` and `npm` boxes out and says nothing
      # about why. The entire value of a dry run is an operator KNOWING that the gate was
      # proven and the registries were not reached, so it is said twice -- once as an
      # annotation on the run, and once in the step summary, which is the page a human
      # actually opens. "Could not check" must never read as "checked clean", and the
      # inverse holds too: "checked, and deliberately stopped" must not read as "published".
      - name: Dry run stops here -- nothing was published
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "::notice::DRY RUN on $GITHUB_REF_NAME -- verify, build, twine check and the tag/version comparison all passed. The pypi and npm jobs are SKIPPED, the release environment was never entered, and no approval is armed. Re-dispatch with dry_run=false to arm it."
          {
            echo "## Dry run -- nothing was published"
            echo
            echo "Ref: \`$GITHUB_REF_NAME\` ($GITHUB_REF_TYPE)"
            echo
            echo "Passed: \`verify.py --installed\`, build, \`twine check\`, and tag == pyproject == npm."
            echo
            echo "Skipped: the \`pypi\` and \`npm\` jobs. The \`release\` environment was never entered, so no deployment was created and no reviewer was asked."
            echo
            echo "This proves the gates and the Node24 action majors on this ref. It does NOT prove the environment's reviewer rule or its \`tag v*\` branch policy: re-dispatch with \`dry_run=false\` and reject at the approval prompt for that."
          } >> "$GITHUB_STEP_SUMMARY"

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    # A dry run stops before this job, so the `release` environment is never entered: no
    # deployment is created and no approval is armed. Written as "not a dry-run dispatch"
    # rather than as `!inputs.dry_run` because the `inputs` context is empty on a
    # `release: published` event, and a publish path must not depend on how a null coerces.
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    permissions:
      id-token: write
    steps:
      # The other half of the pair uploaded by the `verify` job -- see the note there.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Left at `release/v1` deliberately, and it is not an oversight in the sweep above.
      # It is a moving tag PyPA maintains rather than a major this repo chose, and its
      # action.yml is `using: composite` -- it carries no Node runtime of its own, so there
      # is no node20 pin here to bump. Checked, not assumed.
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    # Same guard as the `pypi` job above, and for the same reason -- see the note there.
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      # v7 is the setup-node major; 22 is still the Node this publishes on, and the two
      # numbers are unrelated. `registry-url` is still a declared input of v7 -- checked,
      # because OIDC publishing depends on it.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC
        # Trusted publishing on npm needs npm >= 11.5.1; Node 22 ships npm 10, which would
        # look for a token that deliberately does not exist here and fail as an auth error
        # rather than as the version problem it actually is.
        run: npm install -g npm@latest

      - name: Launcher self-test
        # Runs where Python is irrelevant: it proves the launcher parses, resolves its
        # interpreter candidates, and reports honestly — the half that must work before
        # Python is even looked for.
        run: npm test
        working-directory: npm

      # A release workflow gets re-run — because a sibling job failed, because a gate
      # caught something, because a step was fixed. Publishing is the one step that cannot
      # be repeated: npm refuses a version that already exists, so on a second run the job
      # would fail red for the sound reason that it already succeeded. This asks the
      # registry first and reports the honest outcome either way.
      - name: Publish
        working-directory: npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VER is already on the registry — nothing to publish."
          else
            npm publish --provenance --access public
          fi
