name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Node24-native action majors; the reason is written out in ci.yml's step block.
      # The action major and `node-version` are unrelated numbers: v7 is the setup-node
      # release, 22 is still the Node this site builds on.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      # `using: composite`, so it carries no Node runtime of its own -- it delegates to a
      # SHA-pinned actions/upload-artifact@v7, which is node24. Bumped with the rest so the
      # delegation is to the current pair rather than to v3's node20 upload.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5 still declares the `page_url` output that `environment.url` above reads; that
      # was checked rather than assumed, because a dropped output would silently empty the
      # deployment URL instead of failing.
      - id: deployment
        uses: actions/deploy-pages@v5
