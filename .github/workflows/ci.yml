# Studio Actions rules: ubuntu-latest only, paths-gated, workflow_dispatch
# fallback, concurrency with cancel-in-progress. One OS. This is the only
# workflow this round (release.yml waits on publish, which is on hold).
name: ci

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "verify.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "verify.py"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared requires-python floor. It was metadata only
        # (CI ran 3.13; mypy targets 3.12). This job is the core extra,
        # not [image]. numpy 2.5 from [image] needs 3.12; that extra is
        # not claimed on 3.11.
        python-version: ["3.11", "3.13"]
    steps:
      # ACTION MAJORS ARE PINNED TO THE NODE24-NATIVE ONES, IN ALL THREE WORKFLOWS.
      # The reason lives here because this is the file that already had half of it.
      #
      # Every third-party action except this checkout used to target the Node 20 runtime
      # GitHub is removing. Nothing was red: the runner force-ran them on Node 24 and
      # printed "Node.js 20 is deprecated" once per step. That warning is a schedule, and
      # the schedule is GitHub's, not this repo's -- on the Node16->20 cycle the sequence
      # was warn, then force, then remove the shim, and removal turns every un-bumped step
      # into a hard failure at `Run actions/X`. That would have taken ci.yml, pages.yml
      # AND release.yml -- the credentialed publish path -- on the same day, chosen by
      # someone else. checkout@v5 sitting one file away from release.yml's checkout@v4 for
      # the identical action was the tell: solved once, not propagated.
      #
      # Each target major was read back before it was pinned: `runs.using: node24` in its
      # own action.yml, and every input this repo passes still declared there.
      # upload-pages-artifact@v5 is `using: composite` rather than node24 and is not an
      # exception -- it delegates to a SHA-pinned actions/upload-artifact@v7, which is.
      #
      # These are drop-in majors for this repo's plain usage, verified statically. A major
      # bump can still carry behavior this reading did not cover; one real run per workflow
      # is what actually settles that, and pages.yml/release.yml are triggered rarely enough
      # that the first such run may be a real deploy or a real release.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The documented install path. If this fails, the README's
      # `pip install -e ".[dev]"` is still a claim the tree cannot support.
      - name: install (editable, dev extra)
        run: python -m pip install -e ".[dev]" build

      - name: verify
        run: python verify.py --installed

      # Dependency scanning. pip-audit resolves the installed set against the
      # Python Packaging Advisory Database. It runs AFTER verify deliberately: a
      # red audit on a tree whose suite is already broken tells you nothing about
      # the dependency.
      #
      # `setuptools>=83` is here because the 3.11 leg still gets a bundled
      # setuptools from `ensurepip` (79.0.1, carrying PYSEC-2026-3447) while 3.12+
      # stopped bundling it. That setuptools is ambient environment, not a declared
      # dependency of this package — but pip-audit audits the environment, not the
      # dependency set, so it reds the leg regardless of what pyproject asks for.
      #
      # Upgrading is the honest fix. `--ignore-vuln PYSEC-2026-3447` would make the
      # step green by lowering the gate, which is the one move this repo does not
      # make. The cost is symmetric and worth saying out loud rather than leaving to
      # be noticed: on 3.13 this *installs* a setuptools that was not there before.
      # That is harmless, and it keeps the two legs identical instead of
      # conditionally different.
      - name: install pip-audit
        run: python -m pip install pip-audit "setuptools>=83"

      # `--skip-editable` and NOT `--strict`, and the reason is the package itself.
      # CI installs this project with `-e`, so the environment contains an editable
      # `pcraft` at a version that is not on PyPI — under `--strict` that is a hard
      # error, and the audit fails because the thing being developed has not been
      # published yet. That is not a dependency finding.
      #
      # The skip is VISIBLE rather than silent: pip-audit prints a table naming what
      # it skipped and why, so "could not audit" never reads as "audited clean" —
      # the distinction this whole codebase is built around. Any real vulnerability
      # in an actual dependency still fails the step.
      - name: dependency audit
        run: python -m pip_audit --skip-editable --progress-spinner off
