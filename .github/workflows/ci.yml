# Studio Actions rules: ubuntu-latest only, paths-gated, workflow_dispatch
# fallback, concurrency with cancel-in-progress. One OS. This is the only
# workflow this round (release.yml waits on publish, which is on hold).
name: ci

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "verify.py"
      - ".github/workflows/**"
      - "atlas/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "verify.py"
      - ".github/workflows/**"
      - "atlas/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared requires-python floor. It was metadata only
        # (CI ran 3.13; mypy targets 3.12). This job is the core extra,
        # not [image]. numpy 2.5 from [image] needs 3.12; that extra is
        # not claimed on 3.11.
        python-version: ["3.11", "3.13"]
    env:
      # 'true' on the one leg whose coverage and test results go to Codecov,
      # on a pull request or a push to the default branch.
      COVERAGE_LEG: ${{ matrix.python-version == '3.11' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      # ACTION MAJORS ARE PINNED TO THE NODE24-NATIVE ONES, IN ALL THREE WORKFLOWS.
      # The reason lives here because this is the file that already had half of it.
      #
      # Every third-party action except this checkout used to target the Node 20 runtime
      # GitHub is removing. Nothing was red: the runner force-ran them on Node 24 and
      # printed "Node.js 20 is deprecated" once per step. That warning is a schedule, and
      # the schedule is GitHub's, not this repo's -- on the Node16->20 cycle the sequence
      # was warn, then force, then remove the shim, and removal turns every un-bumped step
      # into a hard failure at `Run actions/X`. That would have taken ci.yml, pages.yml
      # AND release.yml -- the credentialed publish path -- on the same day, chosen by
      # someone else. checkout@v5 sitting one file away from release.yml's checkout@v4 for
      # the identical action was the tell: solved once, not propagated.
      #
      # Each target major was read back before it was pinned: `runs.using: node24` in its
      # own action.yml, and every input this repo passes still declared there.
      # upload-pages-artifact@v5 is `using: composite` rather than node24 and is not an
      # exception -- it delegates to a SHA-pinned actions/upload-artifact@v7, which is.
      #
      # These are drop-in majors for this repo's plain usage, verified statically. A major
      # bump can still carry behavior this reading did not cover; one real run per workflow
      # is what actually settles that, and pages.yml/release.yml are triggered rarely enough
      # that the first such run may be a real deploy or a real release.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The committed Atlas map (atlas/) must match the tree. Atlas needs
      # Node 22 or later, and the map is the same on every cell, so it is
      # checked on the 3.13 cell only.
      - name: Set up Node for Atlas
        if: matrix.python-version == '3.13'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Atlas check
        if: matrix.python-version == '3.13'
        run: npx --yes @dogfood-lab/atlas@1.20.0 check

      # The documented install path. If this fails, the README's
      # `pip install -e ".[dev]"` is still a claim the tree cannot support.
      - name: install (editable, dev extra)
        run: python -m pip install -e ".[dev]" build

      - name: verify
        id: tests
        run: python verify.py --installed

      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      # Dependency scanning. pip-audit resolves the installed set against the
      # Python Packaging Advisory Database. It runs AFTER verify deliberately: a
      # red audit on a tree whose suite is already broken tells you nothing about
      # the dependency.
      #
      # `setuptools>=83` is here because the 3.11 leg still gets a bundled
      # setuptools from `ensurepip` (79.0.1, carrying PYSEC-2026-3447) while 3.12+
      # stopped bundling it. That setuptools is ambient environment, not a declared
      # dependency of this package — but pip-audit audits the environment, not the
      # dependency set, so it reds the leg regardless of what pyproject asks for.
      #
      # Upgrading is the honest fix. `--ignore-vuln PYSEC-2026-3447` would make the
      # step green by lowering the gate, which is the one move this repo does not
      # make. The cost is symmetric and worth saying out loud rather than leaving to
      # be noticed: on 3.13 this *installs* a setuptools that was not there before.
      # That is harmless, and it keeps the two legs identical instead of
      # conditionally different.
      - name: install pip-audit
        run: python -m pip install pip-audit "setuptools>=83"

      # `--skip-editable` and NOT `--strict`, and the reason is the package itself.
      # CI installs this project with `-e`, so the environment contains an editable
      # `pcraft` at a version that is not on PyPI — under `--strict` that is a hard
      # error, and the audit fails because the thing being developed has not been
      # published yet. That is not a dependency finding.
      #
      # The skip is VISIBLE rather than silent: pip-audit prints a table naming what
      # it skipped and why, so "could not audit" never reads as "audited clean" —
      # the distinction this whole codebase is built around. Any real vulnerability
      # in an actual dependency still fails the step.
      - name: dependency audit
        run: python -m pip_audit --skip-editable --progress-spinner off

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: verify
    if: ${{ !cancelled() && needs.verify.result != 'cancelled' && needs.verify.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: .

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .

      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.verify.result == 'success' || hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage.xml

      - name: Upload test results to Codecov
        if: ${{ needs.verify.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml
