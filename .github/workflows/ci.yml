# Studio Actions rules: ubuntu-latest only, paths-gated, workflow_dispatch
# fallback, concurrency with cancel-in-progress. One OS. This is the only
# workflow this round (release.yml waits on publish, which is on hold).
name: ci

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "verify.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "verify.py"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared requires-python floor. It was metadata only
        # (CI ran 3.13; mypy targets 3.12). This job is the core extra,
        # not [image]. numpy 2.5 from [image] needs 3.12; that extra is
        # not claimed on 3.11.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The documented install path. If this fails, the README's
      # `pip install -e ".[dev]"` is still a claim the tree cannot support.
      - name: install (editable, dev extra)
        run: python -m pip install -e ".[dev]" build

      - name: verify
        run: python verify.py --installed

      # Dependency scanning. pip-audit resolves the installed set against the
      # Python Packaging Advisory Database. It runs AFTER verify deliberately: a
      # red audit on a tree whose suite is already broken tells you nothing about
      # the dependency.
      - name: install pip-audit
        run: python -m pip install pip-audit

      # `--skip-editable` and NOT `--strict`, and the reason is the package itself.
      # CI installs this project with `-e`, so the environment contains an editable
      # `pcraft` at a version that is not on PyPI — under `--strict` that is a hard
      # error, and the audit fails because the thing being developed has not been
      # published yet. That is not a dependency finding.
      #
      # The skip is VISIBLE rather than silent: pip-audit prints a table naming what
      # it skipped and why, so "could not audit" never reads as "audited clean" —
      # the distinction this whole codebase is built around. Any real vulnerability
      # in an actual dependency still fails the step.
      - name: dependency audit
        run: python -m pip_audit --skip-editable --progress-spinner off
