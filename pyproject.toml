[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcraft"
version = "0.1.0"
description = "Contract-driven generative-asset production template: typed depictable contracts -> constrained synthesizer -> different-family gate -> retry/repair -> bind. Domain-agnostic core + per-domain plugins (image/video/workflow)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" }]
keywords = ["diffusion", "sprite", "contract", "verifier", "dspy", "generative-assets"]

# Core is DOMAIN-AGNOSTIC and GPU-free: pydantic for the typed contract, typer for the CLI.
# Everything that touches a GPU, an LLM backend, or a diffusion model is an OPTIONAL extra,
# so `pip install -e .` + the core test suite run on any machine without CUDA.
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
# The 600B synthesizer + offline optimizer (DSPy talks to an Ollama-Cloud LM backend).
synth = ["dspy-ai>=2.5", "httpx>=0.27"]
# The image domain plugin: diffusion generator + VLM verifiers. GPU. Heavy.
image = [
    "torch>=2.4",
    "diffusers>=0.30",
    "transformers>=4.44",
    "accelerate>=0.33",
    "pillow>=10.0",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
pcraft = "pcraft.cli:app"

[project.urls]
Repository = "https://github.com/mcp-tool-shop-org/prompt-craft"

[tool.hatch.build.targets.wheel]
packages = ["src/pcraft"]

# Non-Python plugin assets (generated encoder rules, pinned compiled artifacts,
# example contracts, calibration thresholds) ship inside the package.
[tool.hatch.build.targets.wheel.force-include]
"src/pcraft/domains/image/rules" = "pcraft/domains/image/rules"
"src/pcraft/domains/image/compiled" = "pcraft/domains/image/compiled"
"src/pcraft/domains/image/subdomains/sprite/contracts" = "pcraft/domains/image/subdomains/sprite/contracts"
"src/pcraft/domains/image/subdomains/sprite/thresholds" = "pcraft/domains/image/subdomains/sprite/thresholds"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Core tests must pass with NO GPU and NO network: that is the proof the plugin boundary holds.
markers = [
    "gpu: requires a CUDA GPU + the [image] extra (deselected by default)",
    "network: requires an Ollama-Cloud / LM backend (deselected by default)",
]
addopts = "-m 'not gpu and not network'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
packages = ["pcraft"]
ignore_missing_imports = true
