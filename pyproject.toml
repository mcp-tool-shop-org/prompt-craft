[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The DISTRIBUTION name. `pcraft` was taken on PyPI, and it is also the import
# package and the console script — those stay `pcraft`, so `pip install prompt-crafter`
# gives you `import pcraft` and a `pcraft` command. The PyPI pending publisher is
# registered for this exact name with workflow release.yml, and both are matched
# byte-for-byte at authentication time.
name = "prompt-crafter"
version = "0.4.0"
description = "Say what the picture must contain, check that it does, and refuse when it does not. A typed contract of depictable claims drives both the prompt and the gate that verifies the pixels."
# PyPI-specific. The GitHub README opens with a logo at a repo-relative path and a
# seven-language nav bar of sibling files — both render as broken links on PyPI, which
# has no repository around it. This file carries the same content with nothing relative
# in it.
readme = "README.pypi.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" }]
keywords = ["diffusion", "sprite", "contract", "verifier", "dspy", "generative-assets"]

# Core is DOMAIN-AGNOSTIC and GPU-free: pydantic for the typed contract, typer for the CLI.
# Everything that touches a GPU, an LLM backend, or a diffusion model is an OPTIONAL extra,
# so `pip install -e .` + the core test suite run on any machine without CUDA.
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
# The 600B synthesizer + offline optimizer (DSPy talks to an Ollama-Cloud LM backend).
synth = ["dspy-ai>=2.5", "httpx>=0.27"]
# The image domain plugin: diffusion generator + VLM verifiers. GPU. Heavy.
image = [
    "torch>=2.4",
    "diffusers>=0.30",
    "transformers>=4.44",
    "accelerate>=0.33",
    "pillow>=10.0",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Upper-bounded because lint is a hard release gate (verify.py). Unbounded, CI
    # resolved 0.16.3 against a local 0.15.16 and the same tree linted clean here and
    # failed there. `[tool.ruff.lint] select` already fixes the rule set; this stops the
    # TOOL from moving under a gate that can block a publish. Raise it deliberately.
    "ruff>=0.6,<0.17",
    # Bounded for the same reason as ruff: typecheck is a hard release gate, and an
    # unpinned mypy reports this fallback import as [assignment] in one version and
    # [no-redef] in another -- the ignore comment then does not cover the code CI emits.
    "mypy>=1.11,<3",
]

[project.scripts]
pcraft = "pcraft.cli:app"

[project.urls]
Homepage = "https://mcp-tool-shop-org.github.io/prompt-craft/"
Documentation = "https://mcp-tool-shop-org.github.io/prompt-craft/handbook/"
Repository = "https://github.com/mcp-tool-shop-org/prompt-craft"
Changelog = "https://github.com/mcp-tool-shop-org/prompt-craft/blob/main/CHANGELOG.md"
Issues = "https://github.com/mcp-tool-shop-org/prompt-craft/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pcraft"]
# Non-Python plugin assets (rules, compiled synth, contracts, thresholds) live
# inside those packages. force-include of the same trees is what collided:
# hatch already ships every file under packages=, and the four mappings
# added the first file a second time. Do not re-add them.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Core tests must pass with NO GPU and NO network: that is the proof the plugin boundary holds.
markers = [
    "gpu: requires a CUDA GPU + the [image] extra (deselected by default)",
    "network: requires an Ollama-Cloud / LM backend (deselected by default)",
]
addopts = "-m 'not gpu and not network'"

[tool.ruff]
line-length = 100
target-version = "py311"

# Declared, not inherited. With no `select`, ruff lints against whatever its DEFAULT rule
# set happens to be in the version that resolved -- so the gate's meaning changed under us:
# ruff 0.15.16 locally passed clean while CI resolved 0.16.3 from an unbounded `ruff>=0.6`
# and produced 62 errors on identical code, failing the v0.3.0 release at the verify gate.
#
# v0.3.0 shipped the narrow historical set (E4/E7/E9/F) to buy a clean release. That was the
# right release-time move and it did not decide what this repo lints for. This block is that
# decision. Every count below was measured with ruff 0.16.3 in a CI-equivalent venv
# (Python 3.13, `pip install -e ".[dev]"`) -- NOT on a dev box, which was wrong in three
# directions on v0.3.0 (ruff 0.15.16, mypy 2.1.0, and a stale editable dist-info).
#
# Families NOT selected. These are rejections with reasons, not oversights:
#
#   ARG  (47)  Unused arguments are interface conformance -- the Verifier / Generator /
#              Synthesizer protocols. 31 are ARG002 on protocol methods. An implementation
#              that ignores an argument it must still accept is not dead code.
#   EM   (99)  Exception-message string literals. Mechanical churn across every raise site
#              for no defect caught.
#   D   (536)  Docstring style. Its own project with its own scope, not a line in this one.
#   S   (763)  bandit -- and most of it is `assert` in tests, which is what tests are.
#   ANN (878)  Annotation coverage. Same. mypy already types what carries contract.
#
# Every `ignore` entry below names the reason it is rejected. An unexplained ignore is how
# this repo got a lint gate whose meaning nobody knew.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # the historical default set the tree has always passed
    "A",     # flake8-builtins -- clean; the one shadow (`compile`) is the command's own name
    "B",     # bugbear -- finds NOTHING once B008 is out. A free standard to hold.
    "BLE",   # blind-except -- 11 sites already carry a deliberate per-site noqa; keep it live
    "C4",    # comprehensions
    "FURB",  # refurb
    "I",     # isort
    "N",     # pep8-naming
    "PERF",  # perflint
    "PL",    # pylint -- see the six carve-outs below
    "PTH",   # pathlib over os.path
    "RUF",   # ruff-specific
    "SIM",   # flake8-simplify
    "TRY",   # tryceratops -- see the two carve-outs below
    "UP",    # pyupgrade
]

ignore = [
    # All 19 are `typer.Option(...)` in a CLI signature -- the idiom Typer REQUIRES. The rule
    # is correct in general and wrong here, and every future command would add another.
    # Rejected globally rather than carried as 19 per-site suppressions.
    "B008",
    # This repo imports inside CLI command bodies ON PURPOSE: it keeps `pcraft --help` fast
    # and keeps `core/` free of diffusion/torch symbols. `tests/test_core_is_gpu_free.py`
    # exists to protect exactly that property. Adopting this would argue with the plugin
    # boundary the package is built on. 119 findings, every one deliberate.
    "PLC0415",
    # 52 of the 58 are in `tests/` -- comparing against a literal is what a test does. The 6
    # in `src/` are hex-length checks (3/6/8) in the palette verifier, where naming the
    # constant would read worse than the digit.
    "PLR2004",
    # Arbitrary complexity thresholds against deliberate signatures. `orchestrate.run()` takes
    # the orchestrator's whole protocol (synthesizer, generator, verifiers, thresholds, config,
    # compensators); splitting it to satisfy a counter would hide the contract, not simplify
    # it. All 23 findings are in `src/`, none in tests.
    "PLR0913", "PLR0917", "PLR0915", "PLR0912",
    # This repo raises `PromptCraftError(code, message, hint)` -- a deliberate structured shape
    # with an exit-code contract behind it. TRY003 pushes toward one exception subclass per
    # message, which would dismantle that shape. 14 findings.
    "TRY003",
    # The raise-inside-try in the CLI is how `typer.Exit` is routed PAST the blind-except
    # backstop -- `except (typer.Exit, typer.Abort): raise` sits directly above it. Abstracting
    # the raise into an inner function would hide the exit contract, not clarify it.
    "TRY301",
]

[tool.mypy]
# 3.12, NOT the 3.11 in requires-python -- and that gap is a known, named cost.
#
# numpy arrives with the [image] extra. numpy 2.5 requires-python >=3.12 and its bundled
# stubs use PEP 695 `type X = ...`. Targeting 3.11, mypy refuses to parse those stubs and
# aborts with "errors prevented further checking" -- so from the moment [image] was
# installed the typecheck stopped checking ANY pcraft code while still reporting as a
# configured gate. A gate that cannot run is the defect class this repo exists to catch,
# so it is fixed here rather than left inert.
#
# Per-module `follow_imports = "skip"` does NOT help: the failure is at parse time, before
# module policy applies (verified against a cleared .mypy_cache).
#
# What this costs: mypy no longer catches 3.12-only syntax that would break on the
# declared 3.11 floor. ruff still targets py311. CI now runs the core+[dev] extra
# on 3.11 and 3.13. [image] (numpy 2.5) is not claimed on 3.11.
python_version = "3.12"
packages = ["pcraft"]
ignore_missing_imports = true
